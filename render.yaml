services:
  - type: web
    name: market-intelligence
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: QUICK_SCORE_THRESHOLD
        value: "65"
      - key: DEEP_ANALYSIS_THRESHOLD
        value: "72"
      - key: SCAN_INTERVAL_MINUTES
        value: "60"
      - key: BREAKING_SCAN_MINUTES
        value: "15"
      - key: ENV
        value: production
